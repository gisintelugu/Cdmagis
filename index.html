<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GIS DATA AVAILABILITY – CDMA</title>
<style>
body { font-family: Arial; margin: 20px; background: #f5f6fa; color: #333;}
h1 { text-align: center; color: #1e3799;}
.dashboard { display: flex; justify-content: space-between; gap: 30px; margin-top: 30px;}
.dashboard-section.left { flex: 0 0 440px; max-width:440px; background: #fff; border: 1px solid #eee; border-radius: 12px; box-shadow: 0 1px 6px 0 rgba(140,140,140,0.06); padding: 20px; min-width:320px;}
.dashboard-section.right { flex: 1; background: #fff; border: 1px solid #eee; border-radius: 12px; box-shadow: 0 1px 6px 0 rgba(140,140,140,0.06); padding: 20px; min-width:320px;}
.scorecards, .kpi-row { display: flex; justify-content: space-around; gap: 10px;}
.card {
  flex: 1; margin: 5px; padding: 16px 32px 12px 14px;
  border-radius: 10px; color: white; min-width:130px;
  display: flex; flex-direction: column; align-items: flex-end; 
  justify-content: center; position:relative;
  box-sizing:border-box;
}
.kpi-label {
  font-size: 1.15rem; font-weight: 600; text-align: right; width:100%; margin-bottom:5px;
}
.kpi-separator { width: 90%; height: 1.5px; background: rgba(255,255,255,0.55); margin: 2px 0 6px 0; border:none; }
.kpi-value { font-weight: bold; font-size:2.1rem; line-height:1.15; text-align:right; width:100%; }
.kpi-status-filters { margin-top:8px; margin-bottom:5px; display:flex; gap:7px; align-items:center; justify-content:flex-end; width:100%; }
.kpi-status-filters label{font-size: 1.03rem; cursor:pointer;}
.kpi-status-filters input[type="radio"]{margin-right:3px;}
.available { background:linear-gradient(90deg,#27ae60,#2ecc71);}
.unavailable { background:linear-gradient(90deg,#c0392b,#e74c3c);}
.total { background:linear-gradient(90deg,#2980b9,#3498db);}
.section-title { font-size: 20px; color: #34495e; font-weight:bold; text-align: center; margin-bottom:16px;}
.kpi-row {gap:16px;flex-wrap:wrap;justify-content:center;margin-bottom:28px;}
.layer-filter-bar { display: flex; align-items: center; justify-content: center; margin-bottom:18px;}
.layer-filter-bar label {font-size: 18px;}
.layer-filter-bar select { font-size:18px; padding:12px 20px; min-width:220px; margin-right:8px;}
.layer-filter-bar button { font-size: 17px; padding: 11px 20px; margin-left:10px;}
.analysis-filter-bar {display: flex; justify-content: flex-start; align-items: center; margin-bottom: 24px; gap:16px;}
.analysis-filter-bar select { font-size:18px; padding:12px 20px; margin-right:7px; min-width:200px;}
.analysis-filter-bar button { font-size: 18px; padding:12px 24px; margin-left:8px;}
.export-bar {margin-left:auto;}
@media (max-width: 1100px) {
  .dashboard { flex-direction: column;}
  .dashboard-section.left, .dashboard-section.right {max-width:100%;}
  .kpi-row, .scorecards {flex-direction:column;}
  .card {min-width:unset;margin-bottom:10px;}
  .layer-filter-bar {text-align:left;}
  .analysis-filter-bar {flex-wrap:wrap;}
  .export-bar {margin:12px 0 0 0;}
}
table { width: 100%; border-collapse: collapse; margin: 12px 0 0 0; background: #fff;}
th, td { padding: 10px; border: 1px solid #ddd; text-align: center;}
th { background: #dcdde1;}
.yes { color: green; font-weight: bold;}
.no { color: red; font-weight: bold;}
.new { color: orange; font-weight: bold;}
.additional-section {margin:0 0 0 0;background:#fff;border:0;border-radius:0;padding:0; }
</style>
</head>
<body>
<h1>GIS DATA AVAILABILITY – CDMA</h1>
<div class="dashboard">
  <div class="dashboard-section left" id="layerSection">
    <div class="section-title">Layer Status</div>
    <div class="layer-filter-bar">
      <label for="layerULB">ULB: </label>
      <select id="layerULB"></select>
      <button id="resetLayerBtn" onclick="resetLayerULB()">Reset</button>
    </div>
    <div class="scorecards" id="layerKPIs"></div>
    <div id="dataTable"></div>
  </div>
  <div class="dashboard-section right" id="imagesSection">
    <div class="section-title">Images Data by Region / District</div>
    <div class="analysis-filter-bar">
      <label for="analysisRegion">Region: </label>
      <select id="analysisRegion"></select>
      <label for="analysisDistrict">District: </label>
      <select id="analysisDistrict"></select>
      <label for="analysisULB">ULB: </label>
      <select id="analysisULB"></select>
      <button onclick="resetAnalysisFilters()" id="analysisResetBtn">Reset</button>
      <div class="export-bar">
        <button onclick="exportAnalysisCSV()">Export Table (CSV)</button>
      </div>
    </div>
    <div class="kpi-row" id="kpiCards"></div>
    <div id="analysisTable"></div>
  </div>
</div>
<script>
const sheetId = "1KSzF8TYpmhhgd3T-S0l-y0KZ96muEVST89kMXuYo-sE";
const GIS_KEY = "ULB_Code";
const GIS_NAME = "ULB_NAME";
const DIST_KEY = "DIST_NAME";
const REGION_KEY = "REGION";
const ULB_FIELDS_TO_SKIP = [GIS_KEY, GIS_NAME, DIST_KEY, REGION_KEY];

const analysisFields = [
  GIS_NAME,"HRSI (APMDP)","DEM (APMDP)","ORI (AP RESURVEY-2023)", "DSM (AP RESURVEY-2023)", "DTM (AP RESURVEY-2023)"
];
// Track the radio status filters for each layer
let statusFilters = {
  "HRSI (APMDP)": "",
  "DEM (APMDP)": "",
  "ORI (AP RESURVEY-2023)": "",
  "DSM (AP RESURVEY-2023)": "",
  "DTM (AP RESURVEY-2023)": ""
};

const gisUrl = `https://opensheet.elk.sh/${sheetId}/GISData`;
const imagesUrl = `https://opensheet.elk.sh/${sheetId}/Images`;

let sheetData = [];
let imagesData = [];

// Layer Status section (left)
function statusIcon(status) {
  if (status === "Yes") return '<span class="yes">✔</span>';
  if (status === "No")  return '<span class="no">✖</span>';
  if (status === "New") return '<span class="new">🆕</span>';
  return status ? status : "-";
}
function renderLayerKPIsAndTable() {
  const ulbSel = document.getElementById("layerULB");
  const selectedVal = ulbSel.value;
  const row = sheetData.find(r=>r[GIS_KEY]===selectedVal);
  if(row) {
    let yes=0, no=0, total=0;
    Object.keys(row).forEach(h => {
      if(!ULB_FIELDS_TO_SKIP.includes(h)){
        if(row[h]==="Yes")yes++;
        if(row[h]==="No")no++;
        total++;
      }
    });
    document.getElementById("layerKPIs").innerHTML = `
      <div class="card available">
        <div class="kpi-label">✔ Available</div>
        <hr class="kpi-separator"/>
        <div class="kpi-value">${yes}</div>
      </div>
      <div class="card unavailable">
        <div class="kpi-label">✖ Unavailable</div>
        <hr class="kpi-separator"/>
        <div class="kpi-value">${no}</div>
      </div>
      <div class="card total">
        <div class="kpi-label">Total Layers</div>
        <hr class="kpi-separator"/>
        <div class="kpi-value">${total}</div>
      </div>
    `;
    let html = "<table><tr><th>S.No</th><th>Layer</th><th>Status</th></tr>";
    let i = 1;
    Object.keys(row).forEach(h => {
      if (!ULB_FIELDS_TO_SKIP.includes(h)) {
        html += `<tr><td>${i++}</td><td>${h}</td><td>${statusIcon(row[h])}</td></tr>`;
      }
    });
    html += "</table>";
    document.getElementById("dataTable").innerHTML = html;
  }
}
function populateLayerULBSelect() {
  const ulbSel = document.getElementById("layerULB");
  ulbSel.innerHTML = "";
  sheetData.forEach(row => {
    let option = document.createElement("option");
    option.value = row[GIS_KEY];
    option.textContent = `${row[GIS_NAME]} (${row[GIS_KEY]})`;
    ulbSel.appendChild(option);
  });
}

// Images Section (right) KPIs and status-layer radio filters
function renderSummaryScorecards(filtered) {
  // Helper to get counts based on selected status filter for each layer
  function layerCount(layer, countFor) {
    return filtered.filter(r=>{
      let val = (r[layer]||"").toLowerCase().trim();
      if(countFor==="available") return val==="available";
      if(countFor==="not available") return val==="not available";
      // No filter: count all values that are not blanks
      return val==="available"||val==="not available";
    }).length;
  }
  // Compose the KPI cards + status filter controls (radio buttons)
  // Total ULBs always reflects the filtered list, regardless of layer filter.
  document.getElementById("kpiCards").innerHTML = `
    <div class="card available">
      <div class="kpi-label">Total ULBs</div>
      <hr class="kpi-separator"/>
      <div class="kpi-value">${filtered.length}</div>
    </div>
    ${
      ["HRSI (APMDP)","DEM (APMDP)","ORI (AP RESURVEY-2023)","DSM (AP RESURVEY-2023)","DTM (AP RESURVEY-2023)"].map(layer=>
        `<div class="card" style="${layer==='HRSI (APMDP)'?'background:linear-gradient(90deg,#16a085,#27ae60);':''}
                                   ${layer==='DEM (APMDP)'?'background:linear-gradient(90deg,#00b894,#00cec9);':''}
                                   ${layer==='ORI (AP RESURVEY-2023)'?'background:linear-gradient(90deg,#6c5ce7,#0984e3);':''}
                                   ${layer==='DSM (AP RESURVEY-2023)'?'background:linear-gradient(90deg,#fdcb6e,#e17055);':''}
                                   ${layer==='DTM (AP RESURVEY-2023)'?'background:linear-gradient(90deg,#e17055,#d63031);':''}">
            <div class="kpi-label">${layer.split(" ")[0]} Available</div>
            <hr class="kpi-separator"/>
            <div class="kpi-value">${layerCount(layer,
                statusFilters[layer]==='' ? null : statusFilters[layer].toLowerCase())}</div>
            <div class="kpi-status-filters">
              <label>
                <input type="radio" name="kpiRadio-${layer}" value="Available"
                  ${statusFilters[layer]==="Available"?'checked':''}
                  onclick="window.setStatusFilter&&setStatusFilter('${layer}','Available')">
                Available
              </label>
              <label>
                <input type="radio" name="kpiRadio-${layer}" value="Not Available"
                  ${statusFilters[layer]==="Not Available"?'checked':''}
                  onclick="window.setStatusFilter&&setStatusFilter('${layer}','Not Available')">
                Not Available
              </label>
              <label>
                <input type="radio" name="kpiRadio-${layer}" value=""
                  ${!statusFilters[layer]?'checked':''}
                  onclick="window.setStatusFilter&&setStatusFilter('${layer}','')">
                All
              </label>
            </div>
        </div>`
      ).join('')
    }
  `;
}
// Allow radio control to work in renderSummaryScorecards
window.setStatusFilter = function(layer, value) {
  statusFilters[layer] = value;
  renderAnalysisTable();
};

// Cascading region/district/ULB filter logic for Analysis Table
function refreshAnalysisDistrictOptions() {
  const selectedRegion = document.getElementById("analysisRegion").value;
  let relevant = imagesData;
  if(selectedRegion)
    relevant = relevant.filter(row => row[REGION_KEY] === selectedRegion);
  const distSet = new Set(relevant.map(row => row[DIST_KEY]).filter(Boolean));
  const distSelect = document.getElementById("analysisDistrict");
  distSelect.innerHTML = "<option value=''>All Districts</option>";
  [...distSet].sort().forEach(r => distSelect.innerHTML += `<option value="${r}">${r}</option>`);
  distSelect.selectedIndex = 0;
  refreshAnalysisULBOptions();
}
function refreshAnalysisULBOptions() {
  const selectedRegion = document.getElementById("analysisRegion").value;
  const selectedDistrict = document.getElementById("analysisDistrict").value;
  let relevant = imagesData;
  if(selectedRegion)
    relevant = relevant.filter(row => row[REGION_KEY] === selectedRegion);
  if(selectedDistrict)
    relevant = relevant.filter(row => row[DIST_KEY] === selectedDistrict);
  const ulbSet = new Set(relevant.map(row => row[GIS_NAME]).filter(Boolean));
  const ulbSelect = document.getElementById("analysisULB");
  ulbSelect.innerHTML = "<option value=''>All ULBs</option>";
  [...ulbSet].sort().forEach(r => ulbSelect.innerHTML += `<option value="${r}">${r}</option>`);
  ulbSelect.selectedIndex = 0;
}
function populateAnalysisFilters() {
  const regionSet = new Set(imagesData.map(row => row[REGION_KEY]).filter(Boolean));
  const regionSelect = document.getElementById("analysisRegion");
  regionSelect.innerHTML = "<option value=''>All Regions</option>";
  [...regionSet].sort().forEach(r => regionSelect.innerHTML += `<option value="${r}">${r}</option>`);
  refreshAnalysisDistrictOptions();
}

// Main analysis table render, calls KPIs for filtered images data
function renderAnalysisTable() {
  const selectedRegion = document.getElementById("analysisRegion").value;
  const selectedDistrict = document.getElementById("analysisDistrict").value;
  const selectedULB = document.getElementById("analysisULB").value;
  let filtered = imagesData;
  if (selectedRegion)   filtered = filtered.filter(row => row[REGION_KEY] === selectedRegion);
  if (selectedDistrict) filtered = filtered.filter(row => row[DIST_KEY] === selectedDistrict);
  if (selectedULB)      filtered = filtered.filter(row => row[GIS_NAME] === selectedULB);

  // Apply layer status radio-button filters (AND logic: must match all selected when set)
  for (const layer of Object.keys(statusFilters)) {
    let wanted = statusFilters[layer];
    if(wanted)
      filtered = filtered.filter(r => ((r[layer]||'').toLowerCase().trim() === wanted.toLowerCase()));
  }

  renderSummaryScorecards(filtered);
  if (!filtered.length) {
    document.getElementById("analysisTable").innerHTML = "<div style='color:#666;text-align:center;'>No images data found for selected filters.</div>";
    return;
  }
  let html = "<table><tr>";
  analysisFields.forEach(h => html += `<th>${h}</th>`);
  html += "</tr>";
  filtered.forEach(row => {
    html += "<tr>";
    analysisFields.forEach(h => html += `<td>${row[h] || "-"}</td>`);
    html += "</tr>";
  });
  html += "</table>";
  document.getElementById("analysisTable").innerHTML = html;
}

// Export/copy buttons
function exportAnalysisCSV() {
  const selectedRegion = document.getElementById("analysisRegion").value;
  const selectedDistrict = document.getElementById("analysisDistrict").value;
  const selectedULB = document.getElementById("analysisULB").value;
  let filtered = imagesData;
  if (selectedRegion)   filtered = filtered.filter(row => row[REGION_KEY] === selectedRegion);
  if (selectedDistrict) filtered = filtered.filter(row => row[DIST_KEY] === selectedDistrict);
  if (selectedULB)      filtered = filtered.filter(row => row[GIS_NAME] === selectedULB);
  for (const layer of Object.keys(statusFilters)) {
    let wanted = statusFilters[layer];
    if(wanted)
      filtered = filtered.filter(r => ((r[layer]||'').toLowerCase().trim() === wanted.toLowerCase()));
  }
  let csv = analysisFields.join(",") + "\n";
  filtered.forEach(row =>
    csv += analysisFields.map(f => `"${row[f]||""}"`).join(",") + "\n"
  );
  let a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = "analysis.csv";
  a.click();
}

function resetLayerULB() {
  const ulbSel = document.getElementById("layerULB");
  ulbSel.selectedIndex = 0;
  renderLayerKPIsAndTable();
}
function resetAnalysisFilters() {
  document.getElementById("analysisRegion").selectedIndex = 0;
  refreshAnalysisDistrictOptions();
  document.getElementById("analysisULB").selectedIndex = 0;
  // Reset all KPI status radio filters to 'All'
  Object.keys(statusFilters).forEach(layer=>statusFilters[layer]="");
  renderAnalysisTable();
}

// --- Initial Load ---
async function loadData() {
  const gisResponse = await fetch(gisUrl);
  sheetData = await gisResponse.json();
  const imagesResponse = await fetch(imagesUrl);
  imagesData = await imagesResponse.json();
  // Layer Status
  populateLayerULBSelect();
  renderLayerKPIsAndTable();
  document.getElementById("layerULB").addEventListener("change", renderLayerKPIsAndTable);
  // Images Data
  populateAnalysisFilters();
  renderAnalysisTable();
}
document.getElementById("analysisRegion").addEventListener("change", function() {
  refreshAnalysisDistrictOptions();
  renderAnalysisTable();
});
document.getElementById("analysisDistrict").addEventListener("change", function() {
  refreshAnalysisULBOptions();
  renderAnalysisTable();
});
document.getElementById("analysisULB").addEventListener("change", renderAnalysisTable);
document.getElementById("resetLayerBtn").addEventListener("click", resetLayerULB);
document.getElementById("analysisResetBtn").addEventListener("click", resetAnalysisFilters);
loadData();
</script>
</body>
</html>
